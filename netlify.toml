# Sitio estático. Netlify corre generar.js en cada subida: arma las páginas de productos a partir de productos.json.
# (No instala nada: generar.js usa solo Node.) Netlify usa 404.html automáticamente para las páginas que no existen.
[build]
  publish = "."
  command = "node generar.js"

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Las imágenes no cambian seguido: el navegador las guarda 1 año (la web carga más rápido al volver)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La tipografía tampoco cambia: también se guarda 1 año
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El material de marca (brandbook, logos originales, fuentes) y las plantillas quedan en el repo como referencia,
# pero no se publican: cualquier dirección que empiece así devuelve la página 404.
[[redirects]]
  from = "/material/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/plantillas/*"
  to = "/404.html"
  status = 404
  force = true
